name: Executar Robô de Validação

# O evento de início: o robô roda sempre que o arquivo 'base_entrada.xlsx' for atualizado
on:
  push:
    paths:
      - 'base_entrada.xlsx'
  workflow_dispatch: # Também cria um botão para você rodar manualmente se quiser

jobs:
  auditoria:
    runs-on: ubuntu-latest # O GitHub liga um computador virtual com Linux
    
    steps:
      - name: Puxar os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar o Pandas e Openpyxl
        run: pip install pandas openpyxl

      - name: Rodar o Robô
        run: python robo_auditoria_cpf.py

      - name: Salvar o resultado final no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robô finalizou a validação e gerou o resultado final"
          file_pattern: 'resultado_final.xlsx'
